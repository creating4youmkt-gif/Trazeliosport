<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Plataforma</title><style>{{ css|safe }}body{display:flex;justify-content:center;align-items:center;min-height:100vh}</style></head><body><div class="card" style="width:min(92vw,340px)"><h3>Panel de plataforma</h3>
{% for cat, msg in get_flashed_messages(with_categories=true) %}<div class="msg {{ cat }}">{{ msg }}</div>{% endfor %}<form method="post"><input type="hidden" name="csrf" value="{{ csrf() }}"><input type="password" name="clave" placeholder="Clave de plataforma" required autofocus><br><br><button style="width:100%">Entrar</button></form></div></body></html>
